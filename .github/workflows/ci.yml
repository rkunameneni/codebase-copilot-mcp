name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint (typecheck + ESLint + Prettier)
        run: npm run lint
      - name: Test with coverage (no network, no API keys)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Offline retrieval eval (regression gate)
        run: npm run eval -- --min-hybrid-recall5 0.9
      - name: MCP server smoke test over stdio
        run: npm run smoke:mcp
      - name: CLI smoke test (search and review --dry-run, no API key)
        run: |
          node packages/agent/dist/cli.js search "cancel order refund" --root sample-repo --k 3
          node packages/agent/dist/cli.js review src/main/java/com/example/orders/service/OrderService.java \
            --root sample-repo --dry-run > /dev/null
        working-directory: .
      - name: Upload coverage report
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov-report
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build image and smoke test the containerized server over stdio
        run: npm run smoke:docker
